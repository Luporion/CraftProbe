name: CraftProbe Companion build
on:
  workflow_dispatch:
  push:
    paths:
      - 'companion/**'
      - '.github/workflows/companion-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - run: gradle -p companion/NeoForge-1.21.1 build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: craftprobe-companion-neoforge-1.21.1
          path: companion/NeoForge-1.21.1/build/libs/craftprobe_companion-*.jar
          if-no-files-found: error
