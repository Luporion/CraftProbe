name: CraftProbe Companion build
on:
  workflow_dispatch:
  push:
    paths:
      - 'companion/**'
      - '.github/workflows/companion-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build companion using verified Gradle 8.14 wrapper
        working-directory: companion/NeoForge-1.21.1
        run: ./gradlew build --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: craftprobe-companion-neoforge-1.21.1
          path: companion/NeoForge-1.21.1/build/libs/craftprobe_companion-*.jar
          if-no-files-found: error
